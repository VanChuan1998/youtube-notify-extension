<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang — Kênh Yêu Thích</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --bg: #faf6ef;
    --ink: #201a14;
    --ink-soft: #6b5f4f;
    --accent: #e0472b;
    --accent-ink: #fff8f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  .wrap { text-align: center; max-width: 44ch; }
  .code {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(64px, 14vw, 104px);
    line-height: 1;
    color: var(--accent);
    margin: 0;
  }
  h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: clamp(22px, 4vw, 28px);
    margin: 12px 0 8px;
  }
  p { color: var(--ink-soft); font-size: 15px; margin: 0 0 24px; }
  a {
    display: inline-block;
    padding: 12px 20px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 14.5px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Không tìm thấy trang này</h1>
    <p>Đường dẫn bạn vừa mở không tồn tại hoặc đã được chuyển đi nơi khác.</p>
    <a href="/">Về trang chủ</a>
  </div>
</body>
</html>
