name: Deploy web lên Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Không chạy hai lần deploy chồng nhau; lần push mới nhất thắng.
concurrency:
  group: deploy-web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dùng Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kiểm tra secret đã được cấu hình
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$TOKEN"   || { echo "::error::thiếu secret CLOUDFLARE_API_TOKEN — xem docs/DEPLOY-CLOUDFLARE.md"; exit 1; }
          test -n "$ACCOUNT" || { echo "::error::thiếu secret CLOUDFLARE_ACCOUNT_ID — xem docs/DEPLOY-CLOUDFLARE.md"; exit 1; }

      - name: Web phải có meta charset trước khi lên production
        run: |
          for f in web/*.html; do
            grep -qi '<meta charset="utf-8">' "$f" || { echo "::error file=$f::thiếu <meta charset=\"UTF-8\">"; exit 1; }
          done

      # Chạy Wrangler trực tiếp bằng Node 24 thay vì wrangler-action@v3.
      # GitHub đang loại bỏ Node 20; cách này tránh phụ thuộc runtime cũ của
      # JavaScript Action và dùng đúng biến môi trường CI mà Wrangler hỗ trợ.
      - name: Deploy web với Wrangler 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --version
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 deploy
