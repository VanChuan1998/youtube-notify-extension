name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Kiểm tra extension và web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dùng Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kiểm tra manifest.json hợp lệ
        run: python3 -m json.tool extension/manifest.json > /dev/null

      - name: default_locale phải đi kèm _locales/
        # Khai báo default_locale mà thiếu thư mục _locales/ khiến Chrome từ chối
        # load extension. Đây từng là lỗi chặn của dự án này.
        run: |
          if python3 -c "import json,sys; sys.exit(0 if 'default_locale' in json.load(open('extension/manifest.json')) else 1)"; then
            test -d extension/_locales || { echo "::error::manifest có default_locale nhưng thiếu extension/_locales/"; exit 1; }
          fi

      - name: Kiểm tra cú pháp JavaScript
        run: |
          for f in extension/*.js extension/lib/*.js; do
            node --check "$f"
          done

      - name: Cài dependencies
        run: npm ci

      - name: Chạy test
        run: npm test

      - name: Kiểm tra cú pháp shell script
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Mọi trang web phải có meta charset
        # Thiếu <meta charset="UTF-8"> làm tiếng Việt vỡ thành ký tự lạ khi server
        # không gửi charset trong Content-Type.
        run: |
          for f in web/*.html; do
            grep -qi '<meta charset="utf-8">' "$f" || { echo "::error file=$f::thiếu <meta charset=\"UTF-8\">"; exit 1; }
            grep -qi '<!doctype html>' "$f" || { echo "::error file=$f::thiếu <!doctype html>"; exit 1; }
          done

      - name: Web không được gọi ra font bên thứ ba
        # Font đã self-host trong web/fonts/. Nếu có tham chiếu Google Fonts quay
        # lại thì trang phụ thuộc mạng ngoài và lộ IP người dùng cho Google.
        run: |
          if grep -rn "fonts.googleapis.com\|fonts.gstatic.com" web/*.html; then
            echo "::error::web/ còn tham chiếu Google Fonts — chạy scripts/fetch-fonts.sh và dùng fonts.css"
            exit 1
          fi

      - name: Mọi font trong fonts.css phải tồn tại
        run: |
          python3 - <<'PY'
          import re, sys, os
          css = open("web/fonts.css", encoding="utf-8").read()
          missing = [u for u in re.findall(r"url\('([^']+)'\)", css)
                     if not os.path.exists(os.path.join("web", u))]
          if missing:
              print("::error::thiếu file font: " + ", ".join(missing))
              sys.exit(1)
          print(f"OK — {len(re.findall(r'@font-face', css))} khối @font-face, đủ file")
          PY

      - name: Service worker dùng import phải khai báo type module
        run: |
          python3 - <<'PY'
          import json, sys, glob, re
          m = json.load(open("extension/manifest.json"))
          uses_import = any(
              re.search(r"^\s*import\s", open(f, encoding="utf-8").read(), re.M)
              for f in ["extension/background.js"]
          )
          if uses_import and m.get("background", {}).get("type") != "module":
              print("::error::background.js dùng import nhưng manifest thiếu background.type=module")
              sys.exit(1)
          print("OK")
          PY

      - name: Kiểm tra cấu hình wrangler
        # --dry-run không cần credential, chỉ dựng bản deploy rồi dừng. Bắt lỗi
        # cấu hình ngay ở CI thay vì để job deploy chết sau khi đã merge.
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Đóng gói extension
        run: ./scripts/pack-extension.sh

      - uses: actions/upload-artifact@v6
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Kiểm tra branding và OAuth disclosure
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('.')
          manifest = json.loads((root/'extension/manifest.json').read_text(encoding='utf-8'))
          errors = []
          if manifest.get('name') != 'Auto Mở Live':
              errors.append('manifest.name phải là Auto Mở Live')
          if manifest.get('homepage_url') != 'https://youtube-notification.chuan-nv.com/':
              errors.append('homepage_url không đúng URL production')
          index = (root/'web/index.html').read_text(encoding='utf-8')
          privacy = (root/'web/privacy-policy.html').read_text(encoding='utf-8')
          if 'không yêu cầu đăng nhập' not in index.lower():
              errors.append('homepage thiếu tuyên bố không yêu cầu đăng nhập')
          if 'https://www.googleapis.com/auth/youtube.readonly' not in index:
              errors.append('homepage thiếu disclosure youtube.readonly')
          if 'https://youtube-notification.chuan-nv.com/privacy-policy.html' not in index:
              errors.append('homepage thiếu Privacy URL production')
          if 'chrome.storage.session' not in privacy:
              errors.append('Privacy Policy thiếu mô tả OAuth session storage')
          if 'Cơ chế bảo vệ dữ liệu nhạy cảm' not in privacy or 'Data protection and security mechanisms' not in privacy:
              errors.append('Privacy Policy thiếu mục cơ chế bảo vệ dữ liệu nhạy cảm')
          if 'HTTPS/TLS' not in privacy:
              errors.append('Privacy Policy thiếu mô tả mã hoá HTTPS/TLS khi truyền')
          if errors:
              for e in errors: print('::error::' + e)
              sys.exit(1)
          print('OK — branding/OAuth disclosure nhất quán')
          PY

      - name: Không đưa branding cũ trở lại
        run: |
          if grep -RniE 'Auto Mở Live Youtube|Phiên Google|Google Session' extension web README.md docs --exclude='*.woff2'; then
            echo '::error::Phát hiện tên/cách diễn đạt branding cũ.'
            exit 1
          fi

      - name: Không đưa lại HTML scraping của YouTube
        run: |
          if grep -RniE 'fetch\([^)]*youtube\.com/(watch|@|channel/|c/|user/)|resolveChannelIdByScraping|"isLiveNow"|"isUpcoming"' extension --include='*.js'; then
            echo '::error::Phát hiện logic scrape HTML YouTube; dùng YouTube Data API thay thế.'
            exit 1
          fi

      - name: OAuth token không được lưu bền và phải hỗ trợ silent restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('extension/background.js').read_text(encoding='utf-8')
          errors = []
          if 'getAuthToken(false, clientId, "none")' not in s:
              errors.append('thiếu silent OAuth restore với prompt=none')
          if 'googleOAuthAuthorized: true' not in s:
              errors.append('thiếu persistent non-sensitive OAuth grant marker')
          if 'removeStorage(["googleOAuthAuthorized", "googleOAuthClientId"])' not in s:
              errors.append('Disconnect chưa xoá OAuth grant marker cục bộ')
          if 'setStorage({ oauthToken' in s or 'chrome.storage.local.set({ oauthToken' in s:
              errors.append('không được lưu OAuth access token trong chrome.storage.local')
          if errors:
              for e in errors: print('::error::' + e)
              raise SystemExit(1)
          print('OK — access token chỉ ở session, có silent restore và Disconnect cleanup')
          PY
